name: Since.dev check
description: Check a pull request's dependencies for breaking changes, retiring AI models, removed APIs and runtimes past end of life.
author: Since.dev
branding:
  icon: calendar
  color: gray-dark
inputs:
  api-key:
    description: A Since.dev workspace API key. Store it as a secret, for example SINCE_DEV_KEY.
    required: false
  files:
    description: Which files to check, one pattern per line, relative to the repository root. `**/` matches any folder; `*` matches within a name.
    required: false
    default: |
      **/package.json
      **/requirements*.txt
      **/pyproject.toml
      **/go.mod
      **/Cargo.toml
      **/Gemfile
      **/composer.json
      **/pom.xml
      **/build.gradle
      **/build.gradle.kts
      **/*.csproj
  max-files:
    description: The most files one run sends, manifests and the lockfiles beside them. They are checked together, 50 at a time.
    required: false
    default: "50"
  fail-on:
    description: "Fail the run on a proven finding of this severity or higher: low, medium, high, critical, or none to never fail."
    required: false
    default: high
  github-token:
    description: The token that reads a pull request's changed files and the base's versions of them, for the upgrade receipt. The default works.
    required: false
    default: ${{ github.token }}
  block-upgrades:
    description: "true fails the run when a move of an upgrade-only pull request is not clear; by default it warns."
    required: false
    default: "false"
  api-url:
    description: The API to call.
    required: false
    default: https://api.since.dev
outputs:
  findings:
    description: How many findings the checked files have.
  failing:
    description: How many of them are at or above fail-on and proven.
  as-of:
    description: What the answer is current as of, an ISO time; empty when no source says.
  receipts:
    description: How many moves an upgrade-only pull request makes, each with its receipt in the summary.
  not-clear:
    description: How many of those moves are not clear.
runs:
  using: node24
  main: index.mjs
